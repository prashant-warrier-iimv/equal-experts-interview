services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  http-server:
    build:
      context: .
      dockerfile: dockerfile
    image: ghgist-scraper-http-server
    ports:
      - "8080:8080"
    environment:
      CACHE_HOST: redis
      CACHE_PORT: "6379"
      CACHE_DB: "0"
      ENABLE_RESPONSE_CACHING: "true"
      GITHUB_API_KEY: ${GITHUB_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
